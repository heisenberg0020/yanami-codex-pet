name: Pet pipeline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install image codec dependency
        run: python -m pip install -r requirements.txt
      - name: Test packing, validation, and rollback
        run: python -m unittest discover -s tests -v
      - name: Install companion dependencies
        run: npm ci
      - name: Test companion state, persistence, requests and original timing
        run: npm test
      - name: Build companion UI
        run: npm run build
      - name: Check original atlas stays unchanged
        run: echo '41d2ed83cdd7285a8cbf441fc530b11bce7e6e0c0345192aaf3b2e6a19fa3fe3  assets/upstream/yanami-anna/spritesheet.webp' | sha256sum -c -
      - name: Rebuild unchanged baseline in a temporary directory
        run: python tools/pet_tool.py build --base assets/upstream/yanami-anna/spritesheet.webp --output "$RUNNER_TEMP/yanami-baseline"
      - name: Check candidate if one exists
        run: |
          if [ -f pets/yanami-anna-refined/pet.json ]; then
            python tools/pet_tool.py validate pets/yanami-anna-refined
            python tools/pet_tool.py build \
              --base assets/upstream/yanami-anna/spritesheet.webp \
              --output "$RUNNER_TEMP/yanami-candidate" \
              --replace idle assets/source/iteration-03-native/idle.png 3x2 \
              --replace waiting assets/source/iteration-03-native/waiting.png 3x2 \
              --replace running assets/source/iteration-03-native/running.png 3x2 \
              --fit native
            python -c 'import sys; from PIL import Image; a,b=[Image.open(p).convert("RGBA") for p in sys.argv[1:]]; assert a.size==b.size and a.tobytes()==b.tobytes(), "Committed candidate differs from rebuilt pixels"' \
              pets/yanami-anna-refined/spritesheet.webp "$RUNNER_TEMP/yanami-candidate/spritesheet.webp"
          else
            echo 'No candidate package: art remains under review. This is not a visual acceptance.'
          fi
